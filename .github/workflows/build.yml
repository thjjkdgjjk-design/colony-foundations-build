name: Build Colony Foundations

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: ${{ github.event_name != 'issues' || startsWith(github.event.issue.title, '[build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Colony Foundations JAR
        run: gradle --no-daemon clean build

      - name: Build separate Colony Schematics JAR
        run: gradle --no-daemon -p colony-schematics-addon clean build

      - name: Prepare distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/libs
          ls -lah colony-schematics-addon/build/libs
          mkdir -p build/release
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} build/release/ ';'
          find colony-schematics-addon/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} build/release/ ';'
          test -n "$(find build/release -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -f build/release/colony-foundations-fabric-1.21.5-0.1.0-alpha.1.jar
          test -f build/release/colony-schematics-fabric-1.21.5-0.1.0-alpha.1.jar
          ls -lah build/release

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: colony-fabric-mods-minecraft-1.21.5-java22
          path: build/release/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "Colony Foundations test build ${{ github.run_number }}"
          prerelease: true
          draft: false
          body: |
            Experimental Minecraft 1.21.5 / Fabric builds. This release contains two separate JARs:
            - Colony Foundations: colony-block/build-queue prototype.
            - Colony Schematics: standalone catalog, scan/save scrolls, schematic placement, block-entity NBT restore, entity restore, and server-datapack blueprint discovery/search.
            No upstream MineColonies NBT schematic files are bundled while redistribution rights for the pinned revision are being verified. Install a separately licensed blueprint datapack under data/colony_schematics/blueprints/.
            Structurize parity is still incomplete: no full datafixer migration, tag substitution handlers, undo/redo, survival materials/work orders, true ghost block-model rendering, or integration with a real MineColonies colony economy. Rotation and mirroring are implemented in the catalog but still need in-game regression testing. Unknown blocks are replaced with air if the corresponding dependency mod is not ported/installed.
            The full MineColonies profession/economy systems are not included in Colony Foundations yet.
          files: build/release/*.jar

      - name: Report build result to the build-trigger issue
        if: ${{ always() && github.event_name == 'issues' && startsWith(github.event.issue.title, '[build]') }}
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const body = outcome === 'success'
              ? '✅ CI build succeeded. Both distributable JARs should be attached to this run release: Colony Foundations and the separate Colony Schematics add-on. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.'
              : '❌ CI build failed. Inspect this workflow run for the compile or packaging error: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

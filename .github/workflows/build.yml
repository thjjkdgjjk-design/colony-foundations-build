name: Build Colony Foundations

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  build:
    if: ${{ github.event_name != 'issues' || startsWith(github.event.issue.title, '[build]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Fetch pinned MineColonies citizen-house schematics
        shell: bash
        run: |
          set -euo pipefail
          SCHEMATICS_COMMIT="ae86ba500d3172220669657e0102861fa8b7f3be"
          STYLES=(birch darkoak defaultwooden stone)
          for style in "${STYLES[@]}"; do
            for tier in 1 2 3 4 5; do
              relative="data/colony_foundations/colony_blueprints/minecolonies/${style}/buildings/citizen/citizen${tier}.nbt"
              target="src/main/resources/${relative}"
              mkdir -p "$(dirname "$target")"
              url="https://raw.githubusercontent.com/ldtteam/minecolonies-schematics/${SCHEMATICS_COMMIT}/${style}/buildings/citizen/citizen${tier}.nbt"
              curl --fail --location --retry 3 --connect-timeout 20 "$url" --output "$target"
              test -s "$target"
              asset_target="src/main/resources/assets/colony_foundations/schematics/minecolonies/${style}/buildings/citizen/citizen${tier}.nbt"
              mkdir -p "$(dirname "$asset_target")"
              cp "$target" "$asset_target"
              echo "Fetched ${relative} ($(wc -c < "$target") bytes)"
            done
          done


      - name: Copy pinned schematics into the separate add-on
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p colony-schematics-addon/src/main/resources/assets/colony_schematics/schematics
          cp -R src/main/resources/assets/colony_foundations/schematics/minecolonies colony-schematics-addon/src/main/resources/assets/colony_schematics/schematics/

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build Colony Foundations JAR
        run: gradle --no-daemon clean build

      - name: Build separate Colony Schematics JAR
        run: gradle --no-daemon -p colony-schematics-addon clean build

      - name: Prepare distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/libs
          ls -lah colony-schematics-addon/build/libs
          mkdir -p build/release
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} build/release/ ';'
          find colony-schematics-addon/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} build/release/ ';'
          test -n "$(find build/release -maxdepth 1 -type f -name '*.jar' -print -quit)"
          test -f build/release/colony-foundations-fabric-1.21.5-0.1.0-alpha.1.jar
          test -f build/release/colony-schematics-fabric-1.21.5-0.1.0-alpha.1.jar
          ls -lah build/release

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: colony-fabric-mods-minecraft-1.21.5-java22
          path: build/release/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: "Colony Foundations test build ${{ github.run_number }}"
          prerelease: true
          draft: false
          body: |
            Experimental Minecraft 1.21.5 / Fabric builds. This release contains two separate JARs:
            - Colony Foundations: the colony-building prototype.
            - Colony Schematics: a separate schematic catalog/creative-mode placement tool.
            Both include 20 citizen-house schematics from ldtteam/minecolonies-schematics (GPL-3.0-only), pinned at ae86ba500d3172220669657e0102861fa8b7f3be.
            Colony Schematics places block states only; block entities, inventories, entities and full Structurize behavior are not implemented. The full MineColonies profession/economy systems are not included.
          files: build/release/*.jar

      - name: Report build result to the build-trigger issue
        if: ${{ always() && github.event_name == 'issues' && startsWith(github.event.issue.title, '[build]') }}
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = '${{ job.status }}';
            const body = outcome === 'success'
              ? '✅ CI build succeeded. Both distributable JARs should be attached to this run release: Colony Foundations and the separate Colony Schematics add-on. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.'
              : '❌ CI build failed. Inspect this workflow run for the compile or packaging error: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
